Для чисел от 1 до n:

## Простое решение

def is_palindrome(text):
    cleaned = text.lower().replace(" ", "")
    return cleaned == cleaned[::-1]

print(is_palindrome("А роза упала на лапу Азора"))  # True
print(is_palindrome("hello"))  # False
\`\`\`

## Числовой палиндром

\`\`\`python
def is_number_palindrome(n):
    s = str(n)
    return s == s[::-1]

print(is_number_palindrome(121))   # True
print(is_number_palindrome(123))   # False
\`\`\`

                }

                for (const bLine of bodyLines) {
                  const bTrimmed = bLine.trim();
                  if (bTrimmed.startsWith('print(')) {
                    const val = evaluateExpression(bTrimmed.slice(6, -1));
                    output.push(formatValue(val));
                  } else if (bTrimmed.includes('=') && !bTrimmed.includes('==') && !bTrimmed.startsWith('if')) {
                    const eqIdx = bTrimmed.indexOf('=');
                    variables[bTrimmed.slice(0, eqIdx).trim()] = evaluateExpression(bTrimmed.slice(eqIdx + 1).trim());
                  }
                }
              }
              continue;
            }
          }

          // While loop
          if (trimmed.startsWith('while ')) {
            const whileMatch = trimmed.match(/while (.+):/);
            if (whileMatch) {
              const condition = whileMatch[1];
              const bodyLines = [];
              i++;
              while (i < lines.length && (lines[i].startsWith('    ') || lines[i].startsWith('\t') || lines[i].trim() === '')) {
                if (lines[i].trim() !== '') bodyLines.push(lines[i].replace(/^    /, '').replace(/^\t/, ''));
                i++;
              }

              let iterations = 0;
              while (evaluateExpression(condition) && iterations < 1000) {
                for (const bLine of bodyLines) {
                  const bTrimmed = bLine.trim();
                  if (bTrimmed.startsWith('print(')) {
                    const val = evaluateExpression(bTrimmed.slice(6, -1));
                    output.push(formatValue(val));
                  } else if (bTrimmed.match(/^(\w+)\s*(\+|-|\*|\/)=\s*(.+)$/)) {
                    const m = bTrimmed.match(/^(\w+)\s*(\+|-|\*|\/)=\s*(.+)$/);
                    const value = evaluateExpression(m[3]);
                    switch (m[2]) {
                      case '+': variables[m[1]] += value; break;
                      case '-': variables[m[1]] -= value; break;
                      case '*': variables[m[1]] *= value; break;
                      case '/': variables[m[1]] /= value; break;
                    }
                  } else if (bTrimmed.includes('=') && !bTrimmed.includes('==')) {
                    const eqIdx = bTrimmed.indexOf('=');
                    variables[bTrimmed.slice(0, eqIdx).trim()] = evaluateExpression(bTrimmed.slice(eqIdx + 1).trim());
                  }
                }
                iterations++;
              }
              continue;
            }
          }

          // If/elif/else
          if (trimmed.startsWith('if ') || trimmed.startsWith('elif ') || trimmed === 'else:') {
            const ifBlock = [];
            let currentCondition = trimmed.startsWith('if ') ? trimmed.match(/if (.+):/)?.[1] : (trimmed === 'else:' ? null : null);
            let currentBody = [];

            if (trimmed.startsWith('elif ')) currentCondition = trimmed.match(/elif (.+):/)?.[1];
            if (trimmed === 'else:') currentCondition = null;

            i++;
            while (i < lines.length && (lines[i].startsWith('    ') || lines[i].startsWith('\t') || lines[i].trim() === '')) {
              const innerTrimmed = lines[i].trim();
              if (innerTrimmed.startsWith('elif ') || innerTrimmed === 'else:') {
                ifBlock.push({ condition: currentCondition, body: [...currentBody] });
                currentBody = [];
                if (innerTrimmed.startsWith('elif ')) currentCondition = innerTrimmed.match(/elif (.+):/)?.[1];
                else currentCondition = null;
                i++; continue;
              }
              if (innerTrimmed !== '') currentBody.push(lines[i].replace(/^    /, '').replace(/^\t/, ''));
              i++;
            }
            ifBlock.push({ condition: currentCondition, body: [...currentBody] });

            for (const branch of ifBlock) {
              let shouldExecute = branch.condition === null ? true : Boolean(evaluateExpression(branch.condition));
              if (shouldExecute) {
                for (const bLine of branch.body) {
                  const bTrimmed = bLine.trim();
                  if (bTrimmed.startsWith('print(')) {
                    const val = evaluateExpression(bTrimmed.slice(6, -1));
                    output.push(formatValue(val));
                  } else if (bTrimmed.match(/^(\w+)\s*(\+|-|\*|\/)=\s*(.+)$/)) {
                    const m = bTrimmed.match(/^(\w+)\s*(\+|-|\*|\/)=\s*(.+)$/);
                    const value = evaluateExpression(m[3]);
                    switch (m[2]) {
                      case '+': variables[m[1]] += value; break;
                      case '-': variables[m[1]] -= value; break;
                      case '*': variables[m[1]] *= value; break;
                      case '/': variables[m[1]] /= value; break;
                    }
                  } else if (bTrimmed.includes('=') && !bTrimmed.includes('==')) {
                    const eqIdx = bTrimmed.indexOf('=');
                    variables[bTrimmed.slice(0, eqIdx).trim()] = evaluateExpression(bTrimmed.slice(eqIdx + 1).trim());
                  }
                }
                break;
              }
            }
            continue;
          }

          // Try/except
          if (trimmed.startsWith('try:')) {
            const tryBody = [];
            const exceptBody = [];
            let inExcept = false;
            i++;
            while (i < lines.length && (lines[i].startsWith('    ') || lines[i].startsWith('\t') || lines[i].trim() === '')) {
              const innerTrimmed = lines[i].trim();
              if (innerTrimmed.startsWith('except')) { inExcept = true; i++; continue; }
              if (innerTrimmed.startsWith('finally')) break;
              if (innerTrimmed !== '') {
                if (inExcept) exceptBody.push(lines[i].replace(/^    /, '').replace(/^\t/, ''));
                else tryBody.push(lines[i].replace(/^    /, '').replace(/^\t/, ''));
              }
              i++;
            }

            try {
              for (const bLine of tryBody) {
                const bTrimmed = bLine.trim();
                if (bTrimmed.startsWith('print(')) {
                  const val = evaluateExpression(bTrimmed.slice(6, -1));
                  output.push(formatValue(val));
                } else if (bTrimmed.includes('=') && !bTrimmed.includes('==')) {
                  const eqIdx = bTrimmed.indexOf('=');
                  variables[bTrimmed.slice(0, eqIdx).trim()] = evaluateExpression(bTrimmed.slice(eqIdx + 1).trim());
                }
              }
            } catch (e) {
              for (const bLine of exceptBody) {
                const bTrimmed = bLine.trim();
                if (bTrimmed.startsWith('print(')) {
                  const val = evaluateExpression(bTrimmed.slice(6, -1));
                  output.push(formatValue(val));
                }
              }
            }
            continue;
          }

          // With statement
          if (trimmed.startsWith('with ')) {
            const bodyLines = [];
            i++;
            while (i < lines.length && (lines[i].startsWith('    ') || lines[i].startsWith('\t') || lines[i].trim() === '')) {
              if (lines[i].trim() !== '') bodyLines.push(lines[i].replace(/^    /, '').replace(/^\t/, ''));
              i++;
            }
            for (const bLine of bodyLines) {
              const bTrimmed = bLine.trim();
              if (bTrimmed.startsWith('print(')) {
                const val = evaluateExpression(bTrimmed.slice(6, -1));
                output.push(formatValue(val));
              }
            }
            continue;
          }

          // Decorator
          if (trimmed.startsWith('@')) { i++; continue; }

          // Variable assignment
          const assignMatch = trimmed.match(/^(\w+)\s*=\s*(.+)$/);
          if (assignMatch && !trimmed.startsWith('print')) {
            variables[assignMatch[1]] = evaluateExpression(assignMatch[2]);
            i++; continue;
          }

          // Augmented assignment
          const augMatch = trimmed.match(/^(\w+)\s*(\+|-|\*|\/)=\s*(.+)$/);
          if (augMatch) {
            const value = evaluateExpression(augMatch[3]);
            switch (augMatch[2]) {
              case '+': variables[augMatch[1]] = (variables[augMatch[1]] || 0) + value; break;
              case '-': variables[augMatch[1]] = (variables[augMatch[1]] || 0) - value; break;
              case '*': variables[augMatch[1]] = (variables[augMatch[1]] || 1) * value; break;
              case '/': variables[augMatch[1]] = (variables[augMatch[1]] || 0) / value; break;
            }
            i++; continue;
          }

          // Print
          if (trimmed.startsWith('print(')) {
            const printExpr = trimmed.slice(6, -1);
            const sepMatch = printExpr.match(/,\s*sep\s*=\s*(["'])(.+?)\1/);
            const endMatch = printExpr.match(/,\s*end\s*=\s*(["'])(.+?)\1/);
            let cleanExpr = printExpr.replace(/,\s*sep\s*=\s*(["'])(.+?)\1/, '').replace(/,\s*end\s*=\s*(["'])(.+?)\1/, '').trim();
            if (cleanExpr.endsWith(',')) cleanExpr = cleanExpr.slice(0, -1).trim();
            const sep = sepMatch ? sepMatch[2] : ' ';
            const end = endMatch ? endMatch[2] : '';
            const args = splitArgs(cleanExpr);
            const values = args.map(arg => formatValue(evaluateExpression(arg.trim())));
            output.push(values.join(sep) + end);
            i++; continue;
          }

          i++;
        }

        return output.join('\n');
      } catch (error) {
        return `Error: ${error.message || 'Unknown error'}`;
      }
    }

    // ==================== MARKDOWN RENDERER ====================
    function LessonContent({ content }) {
      const lines = content.split('\n');
      const elements = [];
      let inCodeBlock = false;
      let codeContent = '';
      let key = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('```')) {
          if (inCodeBlock) {
            elements.push(
              <pre key={key++} className="bg-gray-900 rounded-lg p-4 my-3 overflow-x-auto border border-gray-700">
                <code className="text-sm text-green-400 font-mono">{codeContent.trim()}</code>
              </pre>
            );
            codeContent = '';
            inCodeBlock = false;
          } else { inCodeBlock = true; }
          continue;
        }
        if (inCodeBlock) { codeContent += line + '\n'; continue; }
        if (line.startsWith('# ')) elements.push(<h1 key={key++} className="text-2xl font-bold text-white mb-4 mt-2">{line.slice(2)}</h1>);
        else if (line.startsWith('## ')) elements.push(<h2 key={key++} className="text-xl font-bold text-yellow-400 mb-3 mt-5">{line.slice(3)}</h2>);
        else if (line.startsWith('### ')) elements.push(<h3 key={key++} className="text-lg font-bold text-white mb-2 mt-4">{line.slice(4)}</h3>);
        else if (line.startsWith('> ')) elements.push(<div key={key++} className="bg-blue-900/30 border-l-4 border-blue-400 p-3 my-3 rounded-r text-sm text-blue-200" dangerouslySetInnerHTML={{__html: renderInline(line.slice(2))}} />);
        else if (line.startsWith('- ') || line.startsWith('* ')) elements.push(<li key={key++} className="text-gray-300 ml-4 mb-1 list-disc" dangerouslySetInnerHTML={{__html: renderInline(line.slice(2))}} />);
        else if (/^\d+\.\s/.test(line)) elements.push(<li key={key++} className="text-gray-300 ml-4 mb-1 list-decimal" dangerouslySetInnerHTML={{__html: renderInline(line.replace(/^\d+\.\s/, ''))}} />);
        else if (line.trim() === '') elements.push(<div key={key++} className="h-2" />);
        else elements.push(<p key={key++} className="text-gray-300 leading-relaxed mb-2" dangerouslySetInnerHTML={{__html: renderInline(line)}} />);
      }
      return <div>{elements}</div>;
    }

    function renderInline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>')
        .replace(/`(.+?)`/g, '<code class="bg-gray-800 px-1.5 py-0.5 rounded text-yellow-400 text-sm font-mono">$1</code>');
    }

    // ==================== MAIN APP ====================
    function App() {
      const [currentSection, setCurrentSection] = useState(0);
      const [currentLesson, setCurrentLesson] = useState(0);
      const [code, setCode] = useState('');
      const [output, setOutput] = useState('');
      const [completedLessons, setCompletedLessons] = useState(new Set());
      const [showSolution, setShowSolution] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [isRunning, setIsRunning] = useState(false);
      const [testResult, setTestResult] = useState(null);

      useEffect(() => {
        const saved = localStorage.getItem('pylearn-progress');
        if (saved) setCompletedLessons(new Set(JSON.parse(saved)));
      }, []);

      useEffect(() => {
        localStorage.setItem('pylearn-progress', JSON.stringify([...completedLessons]));
      }, [completedLessons]);

      const section = courseData[currentSection];
      const lesson = section?.lessons[currentLesson];

      useEffect(() => {
        if (lesson) {
          setCode(lesson.code);
          setOutput('');
          setShowSolution(false);
          setTestResult(null);
        }
      }, [lesson]);

      const runCode = () => {
        setIsRunning(true);
        setTimeout(() => {
          setOutput(executePython(code));
          setIsRunning(false);
        }, 300);
      };

      const checkSolution = () => {
        if (!lesson) return;
        const result = executePython(code);
        setOutput(result);
        const expected = lesson.tests[0]?.expected || '';
        if (result.trim() === expected.trim()) {
          setTestResult('pass');
          setCompletedLessons(prev => new Set([...prev, lesson.id]));
        } else {
          setTestResult('fail');
        }
      };

      const nextLesson = () => {
        if (currentLesson < section.lessons.length - 1) setCurrentLesson(currentLesson + 1);
        else if (currentSection < courseData.length - 1) { setCurrentSection(currentSection + 1); setCurrentLesson(0); }
      };

      const prevLesson = () => {
        if (currentLesson > 0) setCurrentLesson(currentLesson - 1);
        else if (currentSection > 0) { setCurrentSection(currentSection - 1); setCurrentLesson(courseData[currentSection - 1].lessons.length - 1); }
      };

      const totalLessons = courseData.reduce((acc, s) => acc + s.lessons.length, 0);
      const completedCount = completedLessons.size;
      const progress = totalLessons > 0 ? (completedCount / totalLessons) * 100 : 0;

      if (!lesson) return null;

      return (
        <div className="h-screen flex flex-col bg-gray-900 text-white overflow-hidden">
          {/* Header */}
          <header className="bg-[#0a0a23] border-b border-gray-700 px-4 py-3 flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 hover:bg-gray-700 rounded">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🐍</span>
                <h1 className="text-xl font-bold text-gray-200">
                  <span className="text-yellow-400">Py</span>Learn
                </h1>
              </div>
            </div>
            <div className="flex items-center gap-4">
              <div className="hidden sm:flex items-center gap-2">
                <div className="w-32 h-2 bg-gray-700 rounded-full overflow-hidden">
                  <div className="h-full bg-yellow-400 rounded-full transition-all duration-500" style={{width: `${progress}%`}} />
                </div>
                <span className="text-sm text-gray-400">{completedCount}/{totalLessons}</span>
              </div>
              <div className="flex items-center gap-1 bg-gray-800 rounded-lg px-3 py-1.5">
                <span className="text-yellow-400">🏆</span>
                <span className="text-sm font-medium">{completedCount}</span>
              </div>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            {/* Sidebar */}
            <aside className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:relative z-40 w-72 h-full bg-[#1b1b32] border-r border-gray-700 overflow-y-auto transition-transform duration-300 shrink-0`}>
              <div className="p-4">
                <h2 className="text-lg font-bold text-gray-200 mb-4">📚 Программа курса</h2>
                {courseData.map((sec, sIdx) => (
                  <div key={sec.id} className="mb-3">
                    <button onClick={() => setCurrentSection(sIdx)}
                      className={`w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 transition-colors ${sIdx === currentSection ? 'bg-[#2a2a4b] text-white' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}>
                      <span className="text-lg">{sec.icon}</span>
                      <span className="text-sm font-medium">{sec.title}</span>
                      <span className="ml-auto text-xs text-gray-500">{sec.lessons.filter(l => completedLessons.has(l.id)).length}/{sec.lessons.length}</span>
                    </button>
                    {sIdx === currentSection && (
                      <div className="ml-4 mt-1 space-y-1">
                        {sec.lessons.map((les, lIdx) => (
                          <button key={les.id} onClick={() => { setCurrentSection(sIdx); setCurrentLesson(lIdx); setSidebarOpen(false); }}
                            className={`w-full text-left px-3 py-1.5 rounded text-sm flex items-center gap-2 transition-colors ${lIdx === currentLesson && sIdx === currentSection ? 'bg-yellow-400 text-black font-medium' : completedLessons.has(les.id) ? 'text-green-400 hover:bg-gray-800' : 'text-gray-400 hover:text-white hover:bg-gray-800'}`}>
                            <span className="text-xs">{completedLessons.has(les.id) ? '✅' : lIdx === currentLesson && sIdx === currentSection ? '▶' : '○'}</span>
                            <span className="truncate">{les.title}</span>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </aside>

            {sidebarOpen && <div className="lg:hidden fixed inset-0 bg-black/50 z-30" onClick={() => setSidebarOpen(false)} />}

            {/* Main content */}
            <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">
              <div className="flex-1 overflow-y-auto p-4 lg:p-6">
                <div className="max-w-3xl mx-auto fade-in">
                  <div className="flex items-center gap-2 text-sm text-gray-400 mb-4">
                    <span>{section.icon} {section.title}</span>
                    <span>/</span>
                    <span className="text-white">{lesson.title}</span>
                  </div>

                  <div className="bg-[#1b1b32] rounded-xl p-6 border border-gray-700 mb-6">
                    <LessonContent content={lesson.content} />
                  </div>

                  <div className="bg-[#1b1b32] rounded-xl p-6 border border-yellow-400/30 mb-6">
                    <h3 className="text-yellow-400 font-bold text-lg mb-3 flex items-center gap-2">🎯 Задание</h3>
                    <p className="text-gray-300 leading-relaxed" dangerouslySetInnerHTML={{
                      __html: lesson.task.replace(/\*\*(.+?)\*\*/g, '<strong class="text-white">$1</strong>').replace(/`(.+?)`/g, '<code class="bg-gray-800 px-1.5 py-0.5 rounded text-yellow-400 text-sm">$1</code>')
                    }} />
                    <div className="mt-4">
                      <button onClick={() => setShowSolution(!showSolution)} className="text-sm text-gray-400 hover:text-white transition-colors underline">
                        {showSolution ? '🙈 Скрыть подсказку' : '💡 Показать подсказку'}
                      </button>
                    </div>
                    {showSolution && (
                      <div className="mt-3 bg-gray-800 rounded-lg p-4">
                        <pre className="text-sm text-green-400 whitespace-pre-wrap">{lesson.hint}</pre>
                      </div>
                    )}
                  </div>

                  <div className="flex justify-between items-center">
                    <button onClick={prevLesson} disabled={currentSection === 0 && currentLesson === 0}
                      className="px-4 py-2 bg-gray-700 hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg text-sm transition-colors">← Назад</button>
                    <button onClick={nextLesson} disabled={currentSection === courseData.length - 1 && currentLesson === section.lessons.length - 1}
                      className="px-4 py-2 bg-yellow-400 hover:bg-yellow-300 text-black font-medium disabled:opacity-50 disabled:cursor-not-allowed rounded-lg text-sm transition-colors">Далее →</button>
                  </div>
                </div>
              </div>

              {/* Code editor */}
              <div className="lg:w-[480px] flex flex-col border-t lg:border-t-0 lg:border-l border-gray-700 bg-[#0a0a23] shrink-0 h-[50vh] lg:h-auto">
                <div className="flex items-center justify-between px-4 py-2 bg-[#1b1b32] border-b border-gray-700">
                  <div className="flex items-center gap-2">
                    <div className="flex gap-1.5">
                      <div className="w-3 h-3 rounded-full bg-red-500"></div>
                      <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                      <div className="w-3 h-3 rounded-full bg-green-500"></div>
                    </div>
                    <span className="text-sm text-gray-400 ml-2">editor.py</span>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={runCode} disabled={isRunning}
                      className="px-3 py-1 bg-green-600 hover:bg-green-500 disabled:opacity-50 rounded text-sm font-medium transition-colors flex items-center gap-1">
                      {isRunning ? '⏳' : '▶'} <span>Запуск</span>
                    </button>
                    <button onClick={checkSolution}
                      className="px-3 py-1 bg-yellow-400 hover:bg-yellow-300 text-black rounded text-sm font-medium transition-colors">✓ Проверить</button>
                  </div>
                </div>
                <div className="flex-1 overflow-hidden">
                  <textarea value={code} onChange={(e) => setCode(e.target.value)}
                    className="w-full h-full p-4 bg-[#0a0a23] text-green-400 font-mono text-sm resize-none focus:outline-none leading-relaxed code-editor"
                    spellCheck={false} placeholder="# Напишите ваш код здесь..." />
                </div>
                <div className="border-t border-gray-700 bg-[#1b1b32]">
                  <div className="flex items-center justify-between px-4 py-2 border-b border-gray-700">
                    <span className="text-sm text-gray-400 font-medium">📋 Результат</span>
                    {testResult && (
                      <span className={`text-sm font-medium ${testResult === 'pass' ? 'text-green-400' : 'text-red-400'}`}>
                        {testResult === 'pass' ? '✅ Верно!' : '❌ Неверно'}
                      </span>
                    )}
                  </div>
                  <div className="p-4 h-32 overflow-y-auto">
                    {output ? <pre className="text-sm text-white font-mono whitespace-pre-wrap">{output}</pre>
                      : <p className="text-sm text-gray-500 italic">Нажмите "Запуск" для выполнения кода</p>}
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
